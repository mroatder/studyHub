        titleTh: "เครื่องมือแก้ปัญหาเครือข่าย"
        children: ["ping", "ipconfig", "tracert", "nslookup", "dig", "arp", "netstat", "route", "nmap", "tcpdump", "iptables", "Packet Sniffers", "Port Scanners", "Protocol Analyzers"]
